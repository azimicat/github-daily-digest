name: Keepalive

# GitHub はリポジトリに 60 日間アクティビティがないと schedule 起動のワークフローを
# disabled_inactivity にするため、毎月空コミットを積んで digest.yml の停止を防ぐ

on:
  schedule:
    - cron: '0 0 1 * *'  # 毎月 1 日 00:00 UTC = 09:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push empty commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'schedule ワークフローの自動停止を防ぐため空コミットを積む'
          git push
